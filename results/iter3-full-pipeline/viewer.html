<html lang="en"><head><meta charset="utf-8"><title>pg-gatekeeper · iter3-full-pipeline</title>

<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e8ee;--dim:#9aa3b2;--ok:#3ddc84;--bad:#ff5d5d;--warn:#ffb020;--accent:#7aa2ff;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);line-height:1.45}
header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
h1{font-size:18px;margin:0}h1 small{color:var(--dim);font-weight:400;margin-left:10px}
main{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 62px)}
nav{border-right:1px solid var(--line);padding:14px;overflow:auto}
nav button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--fg);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
nav button:hover{background:var(--panel)}nav button.active{border-color:var(--accent);background:var(--panel)}
nav .tag{float:right;font-size:11px;padding:1px 6px;border-radius:99px;background:var(--line);color:var(--dim)}
section{padding:22px 28px;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}main{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line)}}
.badge{display:inline-block;font-weight:700;padding:3px 10px;border-radius:99px;font-size:12px;letter-spacing:.3px}
.SAFE{background:#123d2a;color:var(--ok)}.UNSAFE{background:#4a1c1c;color:var(--bad)}.ESC{background:#4a3a12;color:var(--warn)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.dim{color:var(--dim)}
pre{background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;font-size:12px;margin:8px 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--dim);font-weight:600}
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:14px}
.ev{margin:8px 0;position:relative}.ev:before{content:"";position:absolute;left:-20px;top:7px;width:10px;height:10px;border-radius:99px;background:var(--dim)}
.ev.tool_call:before{background:var(--accent)}.ev.tool_result:before{background:#555}.ev.rejection:before{background:var(--bad)}.ev.final:before{background:var(--ok)}.ev.assistant:before{background:#c9a3ff}.ev.thinking:before{background:#4a4f5c}
details summary{cursor:pointer;color:var(--fg)}details summary .n{color:var(--dim);font-size:12px;margin-left:6px}
.role{margin:10px 0 18px}.role h4{margin:0 0 8px;text-transform:capitalize}
.kpi{display:flex;gap:18px;flex-wrap:wrap}.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:150px}.kpi b{display:block;font-size:22px}.kpi span{color:var(--dim);font-size:12px}
.md p{margin:6px 0}
</style></head><body>

5. Finish by calling `submit_review` exactly once. The summary is one sentence a DBA acts on; evidence is at most three measured facts with numbers; action is one sentence.\n\n## Hazard definitions (the project's definition of \"unsafe\")\n\nA change is UNSAFE if a Simulation on a 1M-row shadow database shows any of these. Precedence when several apply: DATA_LOSS > LONG_TRANSACTION > CONSTRAINT_SCAN > LOCK_BLOCKING > QUERY_REGRESSION.\n\n- **DATA_LOSS** — the migration errors on existing data, drops a table or column, or narrows a column below its longest existing value (silent truncation).\n- **LONG_TRANSACTION** — a single transaction stays open longer than 2 000 ms (typically a whole-table backfill in one statement). Total wall time does not matter; the longest transaction does. Fix: batch it with short transactions (e.g. a DO block that COMMITs per batch).\n- **CONSTRAINT_SCAN** — `ADD FOREIGN KEY` / `ADD CHECK` validated inline on a populated table (blocks writes for the whole scan). Fix: `NOT VALID`, then `VALIDATE CONSTRAINT`.\n- **LOCK_BLOCKING** — a concurrent writer was stalled for more than 50 ms (or hit lock_timeout). Typical causes: table rewrite (`ALTER COLUMN TYPE`, volatile `DEFAULT`), non-concurrent `CREATE INDEX`. Fix: a non-blocking form (`CONCURRENTLY`, add-nullable-then-backfill, etc.).\n- **QUERY_REGRESSION** — after the migration an affected query seq-scans more than 100 000 rows, or is 5× slower than before. Fix: the right index, usually `CONCURRENTLY`.\n\nSafe operations measure 1–5 ms of writer stall on this database. Numbers above are exact thresholds, not vibes.\n\nNotes for fixes: `CREATE INDEX CONCURRENTLY` cannot run inside a transaction block, so do not wrap it in BEGIN/COMMIT. Batched backfills should update bounded id ranges per statement. To make a NOT NULL column without a rewrite, add it nullable, backfill in batches, add a `CHECK (col IS NOT NULL) NOT VALID`, validate it, then `SET NOT NULL`. For a query that cannot use an index because of an expression like `lower(status)`, create an expression index that matches the query exactly.","user":"# Case 06-create-index-plain: Add an index on orders.status\n\n## schema.sql (current production schema)\n\n```sql\nCREATE TABLE customers (\n  id         bigserial PRIMARY KEY,\n  email      text NOT NULL UNIQUE,\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE orders (\n  id          bigserial PRIMARY KEY,\n  customer_id bigint NOT NULL REFERENCES customers(id),\n  status      text NOT NULL,\n  total_cents integer NOT NULL,\n  notes       text,\n  created_at  timestamptz NOT NULL DEFAULT now(),\n  updated_at  timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX orders_customer_id_idx ON orders (customer_id);\n```\n\n## seed.sql (how the shadow database is populated; production is larger)\n\n```sql\nSELECT setseed(0.42);\nINSERT INTO customers (email)\nSELECT 'user' || g || '@example.com' FROM generate_series(1, 20000) g;\nINSERT INTO orders (customer_id, status, total_cents, notes, created_at, updated_at)\nSELECT (random() * 19999 + 1)::bigint,\n       (ARRAY['pending','paid','shipped','cancelled'])[(random()*3+1)::int],\n       (random() * 50000)::int,\n       CASE WHEN random() \u003c 0.1 THEN 'gift wrap' END,\n       now() - (random() * interval '365 days'),\n       now()\nFROM generate_series(1, 1000000) g;\nANALYZE;\n```\n\n## migration.sql (the change under review)\n\n```sql\nCREATE INDEX orders_status_idx ON orders (status);\n```\n\n## Affected queries\n\n```sql\n-- queries/recent_orders_for_customer.sql (current)\nSELECT id, status, total_cents FROM orders WHERE customer_id = 1234 ORDER BY created_at DESC LIMIT 20;\n```\n\n# Measurement plan from the Planner\n{\n  \"tables_of_interest\": [\n    {\n      \"table\": \"orders\",\n      \"rows\": 1000000,\n      \"relevant_indexes\": [\n        \"orders_pkey\",\n        \"orders_customer_id_idx\",\n        \"orders_status_idx (new)\"\n      ]\n    }\n  ],\n  \"suspected_hazard le or column, or narrows a column below its longest existing value (silent truncation).\n- **LONG_TRANSACTION** — a single transaction stays open longer than 2 000 ms (typically a whole-table backfill in one statement). Total wall time does not matter; the longest transaction does. Fix: batch it with short transactions (e.g. a DO block that COMMITs per batch).\n- **CONSTRAINT_SCAN** — `ADD FOREIGN KEY` / `ADD CHECK` validated inline on a populated table (blocks writes for the whole scan). Fix: `NOT VALID`, then `VALIDATE CONSTRAINT`.\n- **LOCK_BLOCKING** — a concurrent writer was stalled for more than 50 ms (or hit lock_timeout). Typical causes: table rewrite (`ALTER COLUMN TYPE`, volatile `DEFAULT`), non-concurrent `CREATE INDEX`. Fix: a non-blocking form (`CONCURRENTLY`, add-nullable-then-backfill, etc.).\n- **QUERY_REGRESSION** — after the migration an affected query seq-scans more than 100 000 rows, or is 5× slower than before. Fix: the right index, usually `CONCURRENTLY`.\n\nSafe operations measure 1–5 ms of writer stall on this database. Numbers above are exact thresholds, not vibes.\n\nNotes for fixes: `CREATE INDEX CONCURRENTLY` cannot run inside a transaction block, so do not wrap it in BEGIN/COMMIT. Batched backfills should update bounded id ranges per statement. To make a NOT NULL column without a rewrite, add it nullable, backfill in batches, add a `CHECK (col IS NOT NULL) NOT VALID`, validate it, then `SET NOT NULL`. For a query that cannot use an index because of an expression like `lower(status)`, create an expression index that matches the query exactly.","user":"# Case 09-narrow-varchar: Cap customers.email at 20 characters to match the new UI limit\n\n## schema.sql (current production schema)\n\n```sql\nCREATE TABLE customers (\n  id         bigserial PRIMARY KEY,\n  email      text NOT NULL UNIQUE,\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE orders (\n  id          bigserial PRIMARY KEY,\n  customer_id bigint NOT NULL REFERENCES customers(id),\n  status      text NOT NULL,\n  total_cents integer NOT NULL,\n  notes       text,\n  created_at  timestamptz NOT NULL DEFAULT now(),\n  updated_at  timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX orders_customer_id_idx ON orders (customer_id);\n```\n\n## seed.sql (how the shadow database is populated; production is larger)\n\n```sql\nSELECT setseed(0.42);\nINSERT INTO customers (email)\nSELECT 'user' || g || '@example.com' FROM generate_series(1, 20000) g;\nINSERT INTO orders (customer_id, status, total_cents, notes, created_at, updated_at)\nSELECT (random() * 19999 + 1)::bigint,\n       (ARRAY['pending','paid','shipped','cancelled'])[(random()*3+1)::int],\n       (random() * 50000)::int,\n       CASE WHEN random() \u003c 0.1 THEN 'gift wrap' END,\n       now() - (random() * interval '365 days'),\n       now()\nFROM generate_series(1, 1000000) g;\nANALYZE;\n```\n\n## migration.sql (the change under review)\n\n```sql\nALTER TABLE customers ALTER COLUMN email TYPE varchar(20) USING left(email, 20);\n```\n\n## Affected queries\n\n```sql\n-- queries/customer_by_email.sql (current)\nSELECT id, email FROM customers WHERE email = 'user12345@example.com';\n\n-- queries/recent_orders_for_customer.sql (current)\nSELECT id, status, total_cents FROM orders WHERE customer_id = 1234 ORDER BY created_at DESC LIMIT 20;\n```\n\n# Measurement plan from the Planner\n{\n  \"tables_of_interest\": [\n    {\n      \"table\": \"customers\",\n      \"rows\": 20000,\n      \"relevant_indexes\": [\n        \"customers_pkey\",\n        \"customers_email_key (UNIQUE btree on email)\"\n      ]\n    },\n    {\n      \"table\": \"orders\",\n      \"rows\": 1000000,\n      \"relevant_indexes\": [\n        \"orders_pkey\",\n        \"orders_customer_id_idx\"\n      ]\n    }\n  ],\n  \"suspected_hazards\": [\n    {\n      \"hazard\": \"DATA_LOSS: ALTER COLUMN email TYPE varchar(20) USING left(email,20) silently truncates existing emails longer than 20 chars (measured 10001/20000 rows over the limit, max length 21). No error is raised because truncated values don't collide with the UNIQUE constraint in this dataset, so data is silently lost rather than the migration failing loudly.\",\n      \"evidence_that_would_confirm\": \"After running migration, SELECT count(*) FROM customers WHERE length(email)=20 vs original count(*) WHERE length(email)>20 >0; compare stored email values to pre-migration snapshot and show truncated rows (e.g. user12345@example.com -> user12345@example.co, losing final char(s)).\"\n    },\n    {\n      \"hazard\": \"LOCK_BLOCKING/table rewrite: ALTER COLUMN ... TYPE varchar(20) rewrites the whole customers table and takes AccessExclusiveLock, potentially stalling concurrent writers.\",\n      \"evidence_that_would_confirm\": \"Concurrent UPDATE/INSERT against customers during migration transaction observed stalled >50ms or hitting lock_timeout.\"\n    },\n    {\n      \"hazard\": \"LONG_TRANSACTION: the ALTER runs as a single implicit transaction; on 1M-row shadow db (customers is only 20k rows here but production may be much larger) duration could exceed 2000ms if table is large enough, though at 20k rows this is unlikely to trip.\",\n      \"evidence_that_would_confirm\": \"Measure wall-clock duration of the ALTER statement's transaction; compare to 2000ms threshold.\"\n    },\n    {\n      \"hazard\": \"QUERY_REGRESSION: unlikely since column stays indexed equivalently, but confirm customer_by_email query still uses customers_email_key index post-migration and orders query still uses orders_customer_id_idx (unaffected by this migration, included as control).\",\n      \"evidence_that_would_confirm\": \"EXPLAIN shows Index Scan using customers_email_key / orders_customer_id_idx before and after, with similar cost/rows.\"\n    }\n  ],\n  \"simulations_to_run\": [\n    \"migration.sql as written (ALTER TABLE customers ALTER COLUMN email TYPE varchar(20) USING left(email, 20)) on 1M-row-scale shadow db, capturin as written before forming a verdict. Never infer the verdict from the SQL text alone.\n2. Read the evidence literally: writer stall in ms, migration duration, lock modes, rows before/after, dropped or narrowed columns, query plans. Apply the hazard thresholds exactly.\n3. If the change is UNSAFE, write a rewritten migration that reaches the same end state without the hazard, then prove it with `verify_fix`. Only claim `fix_verified: true` if `verify_fix` reports the fix clean under the thresholds AND `schema_equivalent: true`. If your first fix is not clean, revise it and verify again.\n4. If the change is SAFE, say so plainly; do not invent a fix.\n5. Finish by calling `submit_review` exactly once. The summary is one sentence a DBA acts on; evidence is at most three measured facts with numbers; action is one sentence.\n\n## Hazard definitions (the project's definition of \"unsafe\")\n\nA change is UNSAFE if a Simulation on a 1M-row shadow database shows any of these. Precedence when several apply: DATA_LOSS > LONG_TRANSACTION > CONSTRAINT_SCAN > LOCK_BLOCKING > QUERY_REGRESSION.\n\n- **DATA_LOSS** — the migration errors on existing data, drops a table or column, or narrows a column below its longest existing value (silent truncation).\n- **LONG_TRANSACTION** — a single transaction stays open longer than 2 000 ms (typically a whole-table backfill in one statement). Total wall time does not matter; the longest transaction does. Fix: batch it with short transactions (e.g. a DO block that COMMITs per batch).\n- **CONSTRAINT_SCAN** — `ADD FOREIGN KEY` / `ADD CHECK` validated inline on a populated table (blocks writes for the whole scan). Fix: `NOT VALID`, then `VALIDATE CONSTRAINT`.\n- **LOCK_BLOCKING** — a concurrent writer was stalled for more than 50 ms (or hit lock_timeout). Typical causes: table rewrite (`ALTER COLUMN TYPE`, volatile `DEFAULT`), non-concurrent `CREATE INDEX`. Fix: a non-blocking form (`CONCURRENTLY`, add-nullable-then-backfill, etc.).\n- **QUERY_REGRESSION** — after the migration an affected query seq-scans more than 100 000 rows, or is 5× slower than before. Fix: the right index, usually `CONCURRENTLY`.\n\nSafe operations measure 1–5 ms of writer stall on this database. Numbers above are exact thresholds, not vibes.\n\nNotes for fixes: `CREATE INDEX CONCURRENTLY` cannot run inside a transaction block, so do not wrap it in BEGIN/COMMIT. Batched backfills should update bounded id ranges per statement. To make a NOT NULL column without a rewrite, add it nullable, backfill in batches, add a `CHECK (col IS NOT NULL) NOT VALID`, validate it, then `SET NOT NULL`. For a query that cannot use an index because of an expression like `lower(status)`, create an expression index that matches the query exactly.","user":"# Case 10-add-fk-validated-inline: Add a foreign key from orders to customers\n\n## schema.sql (current production schema)\n\n```sql\nCREATE TABLE customers (\n  id         bigserial PRIMARY KEY,\n  email      text NOT NULL UNIQUE,\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE orders (\n  id          bigserial PRIMARY KEY,\n  customer_id bigint NOT NULL REFERENCES customers(id),\n  status      text NOT NULL,\n  total_cents integer NOT NULL,\n  notes       text,\n  created_at  timestamptz NOT NULL DEFAULT now(),\n  updated_at  timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX orders_customer_id_idx ON orders (customer_id);\n```\n\n## seed.sql (how the shadow database is populated; production is larger)\n\n```sql\nSELECT setseed(0.42);\nINSERT INTO customers (email)\nSELECT 'user' || g || '@example.com' FROM generate_series(1, 20000) g;\nINSERT INTO orders (customer_id, status, total_cents, notes, created_at, updated_at)\nSELECT (random() * 19999 + 1)::bigint,\n       (ARRAY['pending','paid','shipped','cancelled'])[(random()*3+1)::int],\n       (random() * 50000)::int,\n       CASE WHEN random() \u003c 0.1 THEN 'gift wrap' END,\n       now() - (random() * interval '365 days'),\n       now()\nFROM generate_series(1, 1000000) g;\nANALYZE;\n```\n\n## migration.sql (the change under review)\n\n```sql\nALTER TABLE orders ADD CONSTRAINT orders_customer_id_fkey2 FOREIGN KEY (customer_id) REFERENCES customers (id);\n```\n\n## Affected queries\n\n```sql\n-- queries/recent_orders_for_customer.sql (current)\nSELECT id, status, total_cents FROM orders WHERE customer_id = 1234 ORDER BY created_at DESC LIMIT 20;\n```\n\n# Measurement plan from the Planner\n{\n  \"tables_of_interest\": [\n    {\n      \"table\": \"orders\",\n      \"rows\": 1000000,\n      \"relevant_indexes\": [\n        \"orders_pkey\",\n        \"orders_customer_id_idx\",\n        \"orders_customer_id_fkey (existing FK, validated)\"\n      ]\n    },\n    {\n      \"table\": \"customers\",\n      \"rows\": 20000,\n      \"relevant_indexes\": [\n        \"customers_pkey\"\n      ]\n    }\n  ],\n  \"suspected_hazards\": [\n    {\n      \"hazard\": \"CONSTRAINT_SCAN - ADD CONSTRAINT ... FOREIGN KEY without NOT VALID will scan all 1,000,000 rows of orders to validate, taking an ACCESS SHARE lock on customers and briefly a SHARE ROW EXCLUSIVE-ish lock on orders, blocking concurrent writes for the duration of the validation scan.\",\n      \"evidence_that_would_confirm\": \"EXPLAIN/timing of the ALTER TABLE shows a seq scan (or index scan) over ~1M rows of orders taking noticeably >50ms of exclusive lock time; a concurrent UPDATE/INSERT on orders is measured stalled >50ms during the ALTER.\"\n    },\n    {\n      \"hazard\": \"LOCK_BLOCKING - even a fast validation could still momentarily block writers since ADD CONSTRAINT takes SHARE ROW EXCLUSIVE lock on orders for the duration, independent of NOT VALID usage; only the initial ADD (without VALIDATE) needs to be quick since validate can be deferred and run with a lesser lock.\",\n      \"evidence_that_would_confirm\": \"Simulate a concurrent writer doing INSERT/UPDATE into orders while migration runs; measure max stall ms.\"\n    },\n    {\n      \"hazard\": \"Redundant constraint - this FK is functionally a duplicate of the already-existing validated orders_customer_id_fkey, so no data-loss/constraint violation risk, but doesn't reduce the need to avoid inline validation.\",\n      \"evidence_that_would_confirm\": \"pg_constraint shows two FK constraints referencing the same columns after migration; no functional benefit, but same lock cost as any inline FK validation.\"\n    }\n  ],\n  \"simulations_to_run\": [\n    \"-- original migration\\nALTER TABLE orders ADD CONSTRAINT orders_customer_id_fkey2 FOREIGN KEY (customer_id) REFERENCES customers (id);\",\n    \"-- candidate rewrite: NOT VALID then VALIDATE separately\\nALTER TABLE orders ADD CONSTRAINT orders_customer_id_fkey2 FOREIGN KEY (customer_id) REFERENCES customers (id) NOT VALID;\\nALTER TABLE orders VALIDATE CONSTRAINT orders_customer_id_fkey2;\"\n  ],\n  \"notes\": \"orders has 1,000,000 rows; customer_id is indexed and NOT NULL, and an identical FK constraint (orders_customer_id_fkey) already exists and is validated, so this migration is redundant from a correctness standpoint but still pays the full inline-validation cost against the current 1M-row table (and much larger in production). Measure: (1) duration/lock mode of the ALTER TABLE ADD CONSTRAINT statement itself, (2) whether it holds ACCESS EXCLUSIVE/SHARE ROW EXCLUSIVE lock on orders for the whole scan, (3) stall time of a concurrent writer (INSERT/UPDATE on orders) during the migration, run both for the plain inline version and the NOT VALID + VALIDATE CONSTRAINT rewrite, to compare lock duration and confirm the rewrite reduces writer stall below 50ms even though total wall time is similar. recent_orders_for_customer.sql query plan/cost should be unaffected either way (uses orders_customer_id_idx / orders_pkey), so QUERY_REGRESSION is not expected — include one EXPLAIN ANALYZE of that query pre- and post-migration as a sanity check.\"\n}"},{"ts":"2026-08-28T18:43:34.713Z","role":"exe ons","system":"You are the Executor for a Postgres change review. Your job is to measure, not guess.\n\nRules:\n1. Always run `simulate_migration` on the migration as written before forming a verdict. Never infer the verdict from the SQL text alone.\n2. Read the evidence literally: writer stall in ms, migration duration, lock modes, rows before/after, dropped or narrowed columns, query plans. Apply the hazard thresholds exactly.\n3. If the change is UNSAFE, write a rewritten migration that reaches the same end state without the hazard, then prove it with `verify_fix`. Only claim `fix_verified: true` if `verify_fix` reports the fix clean under the thresholds AND `schema_equivalent: true`. If your first fix is not clean, revise it and verify again.\n4. If the change is SAFE, say so plainly; do not invent a fix.\n5. Finish by calling `submit_review` exactly once. The summary is one sentence a DBA acts on; evidence is at most three measured facts with numbers; action is one sentence.\n\n## Hazard definitions (the project's definition of \"unsafe\")\n\nA change is UNSAFE if a Simulation on a 1M-row shadow database shows any of these. Precedence when several apply: DATA_LOSS > LONG_TRANSACTION > CONSTRAINT_SCAN > LOCK_BLOCKING > QUERY_REGRESSION.\n\n- **DATA_LOSS** — the migration errors on existing data, drops a table or column, or narrows a column below its longest existing value (silent truncation).\n- **LONG_TRANSACTION** — a single transaction stays open longer than 2 000 ms (typically a whole-table backfill in one statement). Total wall time does not matter; the longest transaction does. Fix: batch it with short transactions (e.g. a DO block that COMMITs per batch).\n- **CONSTRAINT_SCAN** — `ADD FOREIGN KEY` / `ADD CHECK` validated inline on a populated table (blocks writes for the whole scan). Fix: `NOT VALID`, then `VALIDATE CONSTRAINT`.\n- **LOCK_BLOCKING** — a concurrent writer was stalled for more than 50 ms (or hit lock_timeout). Typical causes: table rewrite (`ALTER COLUMN TYPE`, volatile `DEFAULT`), non-concurrent `CREATE INDEX`. Fix: a non-blocking form (`CONCURRENTLY`, add-nullable-then-backfill, etc.).\n- **QUERY_REGRESSION** — after the migration an affected query seq-scans more than 100 000 rows, or is 5× slower than before. Fix: the right index, usually `CONCURRENTLY`.\n\nSafe operations measure 1–5 ms of writer stall on this database. Numbers above are exact thresholds, not vibes.\n\nNotes for fixes: `CREATE INDEX CONCURRENTLY` cannot run inside a transaction block, so do not wrap it in BEGIN/COMMIT. Batched backfills should update bounded id ranges per statement. To make a NOT NULL column without a rewrite, add it nullable, backfill in batches, add a `CHECK (col IS NOT NULL) NOT VALID`, validate it, then `SET NOT NULL`. For a query that cannot use an index because of an expression like `lower(status)`, create an expression index that matches the query exactly.","user":"# Case 16-set-not-null-no-nulls: Make customers.email explicitly NOT NULL (it already has no nulls)\n\n## schema.sql (current production schema)\n\n```sql\nCREATE TABLE customers (\n  id         bigserial PRIMARY KEY,\n  email      text UNIQUE,\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE orders (\n  id          bigserial PRIMARY KEY,\n  customer_id bigint NOT NULL REFERENCES customers(id),\n  status      text NOT NULL,\n  total_cents integer NOT NULL,\n  notes       text,\n  created_at  timestamptz NOT NULL DEFAULT now(),\n  updated_at  timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX orders_customer_id_idx ON orders (customer_id);\n```\n\n## seed.sql (how the shadow database is populated; production is larger)\n\n```sql\nSELECT setseed(0.42);\nINSERT INTO customers (email)\nSELECT 'user' || g || '@example.com' FROM generate_series(1, 20000) g;\nINSERT INTO orders (customer_id, status, total_cents, notes, created_at, updated_at)\nSELECT (random() * 19999 + 1)::bigint,\n       (ARRAY['pending','paid','shipped','cancelled'])[(random()*3+1)::int],\n       (random() * 50000)::int,\n       CASE WHEN random() \u003c 0.1 THEN 'gift wrap' END,\n       now() - (random() * interval '365 days'),\n       now()\nFROM generate_series(1, 1000000) g;\nANALYZE;\n```\n\n## migration.sql (the change under review)\n\n```sql\nALTER TABLE customers ALTER COLUMN email SET NOT NULL;\n```\n\n## Affected queries\n\n```sql\n-- queries/customer_by_email.sql (current)\nSELECT id, email FROM customers WHERE email = 'user12345@example.com';\n\n-- queries/recent_orders_for_customer.sql (current)\nSELECT id, status, total_cents FROM orders WHERE customer_id = 1234 ORDER BY created_at DESC LIMIT 20;\n```\n\n# Measurement plan from the Planner\n{\n  \"tables_of_interest\": [\n    {\n      \"table\": \"customers\",\n      \"rows\": 20000,\n      \"relevant_indexes\": [\n        \"customers_pkey\",\n        \"customers_email_key\"\n      ]\n    },\n    {\n      \"table\": \"orders\",\n      \"rows\": 1000000,\n      \"relevant_indexes\": [\n        \"orders_pkey\",\n        \"orders_customer_id_idx\"\n      ]\n    }\n  ],\n  \"suspected_hazards\": [\n    {\n      \"hazard\": \"LOCK_BLOCKING - SET NOT NULL takes ACCESS EXCLUSIVE lock on customers and must scan the table to verify no NULLs, blocking concurrent writers for the scan duration\",\n      \"evidence_that_would_confirm\": \"Simulate a concurrent writer (INSERT/UPDATE on customers) during the ALTER and measure stall; since customers has only 20000 rows this should be well under 50ms, but confirm empirically\"\n    },\n    {\n      \"hazard\": \"LONG_TRANSACTION - the ALTER statement itself is a single transaction\",\n      \"evidence_that_would_confirm\": \"Measure wall time of the ALTER TABLE statement/transaction; expect well under 2000ms given table has only 20000 rows\"\n    },\n    {\n      \"hazard\": \"CONSTRAINT_SCAN-like scan (not an actual constraint, but analogous full-table verification scan)\",\n      \"evidence_that_would_confirm\": \"EXPLAIN/o const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmtV = (r)=> r ? (r.verdict==="SAFE"?"SAFE":"UNSAFE"+(r.hazard?" / "+r.hazard:"")) : "–";
const pct = (x)=> (x*100).toFixed(0)+"%";
$("#model").textContent = DATA.model ? "model "+DATA.model : "";
function nav(){
  const n=$("#nav"); n.innerHTML="";
  const b=document.createElement("button"); b.textContent="Overview"; b.onclick=()=>show("overview",b); n.appendChild(b);
  for(const c of DATA.cases){const x=document.createElement("button"); const g=c.gatekeeper; const ok = c.scores.gatekeeper && c.scores.gatekeeper.actionable;
    x.innerHTML=esc(c.id)+' <span class="tag">'+(g?(ok?"✓":"✗"):"")+'</span>'; x.onclick=()=>show(c.id,x); n.appendChild(x);}
  show("overview", b);
}
function verdictOk(rv,label){ if(!rv||!label) return false; if(rv.verdict!==label.verdict) return false; return label.verdict==="SAFE"||rv.hazard===label.hazard; }
function fixCell(sc){ if(!sc) return '<span class="dim">–</span>'; const req = sc.expected.verdict==="UNSAFE" && sc.expected.hazard!=="DATA_LOSS"; if(!req) return '<span class="dim">–</span>'; return sc.fixProven?'<span class="ok">proven</span>':(sc.falseVerificationClaim?'<span class="bad">false claim</span>':'<span class="bad">none</span>'); }
function show(id,btn){ document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active")); btn.classList.add("active");
  $("#view").innerHTML = id==="overview"?overview():caseView(DATA.cases.find(c=>c.id===id)); }
function overview(){
  const b=DATA.baseline,g=DATA.gatekeeper;
  const k=(t,v,s)=>'<div><span>'+t+'</span><b>'+v+'</b><span>'+(s||"")+'</span></div>';
  let h='<div class="kpi">';
  if(b) h+=k("Baseline · actionable",pct(b.actionableRate),b.actionable+"/"+b.cases+" · verdicts "+b.verdictCorrect+"/"+b.cases+" · $"+b.meanCostUsd.toFixed(2)+"/case");
  if(g) h+=k("Gatekeeper · actionable",pct(g.actionableRate),g.actionable+"/"+g.cases+" · verdicts "+g.verdictCorrect+"/"+g.cases+" · $"+g.meanCostUsd.toFixed(2)+"/case");
  if(b) h+=k("Baseline · fixes proven",b.fixesProven+"/"+b.fixesRequired,b.falseVerificationClaims+" false 'verified' claims");
  if(g) h+=k("Gatekeeper · fixes proven",g.fixesProven+"/"+g.fixesRequired,g.falseVerificationClaims+" false 'verified' claims · "+g.escalated+" escalated");
  h+='</div>';
  h+='<div class="card"><table><tr><th>Case</th><th>Label</th><th>Baseline</th><th>Fix</th><th>Gatekeeper</th><th>Fix</th><th>Cost</th><th>Time</th></tr>';
  for(const c of DATA.cases){const bl=c.baseline,gk=c.gatekeeper,sb=c.scores.baseline,sg=c.scores.gatekeeper;
    const cell=(r,sc)=> r? '<span class="'+(sc&&sc.actionable?"ok":"bad")+'">'+(sc&&sc.actionable?"✓ ":"✗ ")+esc(fmtV(r.review))+'</span>'+(r.needsHumanReview?' <span class="badge ESC">escalated</span>':'') : '<span class="dim">–</span>';
    h+='<tr><td>'+esc(c.id)+'<br><span class="dim">'+esc(c.title)+'</span></td><td>'+esc(fmtV(c.label))+'</td><td>'+cell(bl,sb)+'</td><td>'+fixCell(sb)+'</td><td>'+cell(gk,sg)+'</td><td>'+fixCell(sg)+'</td><td>'+(gk?'$'+gk.usage.costUsd.toFixed(2):'')+'</td><td>'+(gk?(gk.wallMs/1000).toFixed(0)+'s':'')+'</td></tr>';}
  h+='</table></div>';
  if(DATA.comparison) h+='<div class="card"><pre>'+esc(DATA.comparison)+'</pre></div>';
  return h;
}
function review(r,label,sc){ if(!r) return '<div class="card dim">not run</div>'; const v=r.review; const ok=verdictOk(v,label);
  return '<div class="card"><div><span class="badge '+(r.needsHumanReview?"ESC":v.verdict)+'">'+(r.needsHumanReview?"NEEDS HUMAN REVIEW":v.verdict)+'</span> '+(v.hazard?'<b>'+esc(v.hazard)+'</b>':'')+' <span class="'+(ok?"ok":"bad")+'">'+(ok?"matches label":"does not match label")+'</span> <span class="dim">· confidence '+(v.confidence*100).toFixed(0)+'%</span></div>'
  +'<p>'+esc(v.summary)+'</p><ul>'+v.evidence.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>'
  +(v.fixed_migration?'<div><b>Fix</b> · model says '+(v.fix_verified?"verified":"not verified")+' · harness: '+fixCell(sc)+'<pre><code>'+esc(v.fixed_migration.trim())+'</code></pre></div>':'')
  +'<p><b>Do this:</b> '+esc(v.action)+'</p>'+(r.escalationReason?'<p class="dim">Escalated: '+esc(r.escalationReason)+'</p>':'')
  +'<p class="dim">'+esc(r.method)+' · '+(r.wallMs/1000).toFixed(0)+'s · $'+r.usage.costUsd.toFixed(2)+' · '+r.usage.inputTokens.toLocaleString()+' in / '+r.usage.outputTokens.toLocaleString()+' out · '+r.retries+' retries</p></div>'; }
function caseView(c){
  let h='<h2 style="margin-top:0">'+esc(c.id)+' <span class="dim">'+esc(c.title)+'</span></h2>';
  h+='<div class="card"><b>Migration under review</b><pre><code>'+esc(c.migration.trim())+'</code></pre><b>Label</b> (from the harness): '+esc(fmtV(c.label))
  +(c.label&&c.label.evidence?' <span class="dim">· migration '+c.label.evidence.migrationMs+' ms · writer stall '+c.label.evidence.writerMaxStallMs+' ms · locks '+esc(c.label.evidence.locks.map(l=>l.table+':'+l.mode.replace("Lock","")).join(", "))+'</span>':'')+'</div>';
  h+='<div class="grid2"><div><h3>Baseline (one prompt)</h3>'+review(c.baseline,c.label,c.scores.baseline)+'</div><div><h3>Gatekeeper (planner → executor → verifier)</h3>'+review(c.gatekeeper,c.label,c.scores.gatekeeper)+'</div></div>';
  h+='<h3>Trajectories</h3>';
  const order=["baseline","planner","executor","verifier","orchestrator"];
  for(const role of order){ const evs=c.trajectories[role]; if(!evs) continue;
    h+='<div class="card role"><h4>'+role+' <span class="dim">'+evs.length+' events</span></h4><div class="tl">';
    for(const e of evs){ h+='<div class="ev '+e.type+'">'+event(e)+'</div>'; }
    h+='</div></div>'; }
  return h;
}
function event(e){ const t=e.ts.slice(11,19);
  switch(e.type){
    case "instructions": return '<details><summary><b>Instructions</b><span class="n">'+t+'</span></summary><p><b>System</b></p><pre>'+esc(e.system)+'</pre><p><b>User</b></p><pre>'+esc(e.user)+'</pre></details>';
    case "thinking": return '<details><summary class="dim">thinking<span class="n">'+t+'</span></summary><pre>'+esc(e.text)+'</pre></details>';
    case "assistant": return '<div><span class="dim">'+t+' · in '+(e.usage.input||0)+' / cached '+(e.usage.cacheRead||0)+' / out '+(e.usage.output||0)+'</span>'+(e.text?'<div class="md">'+esc(e.text).replace(/\n/g,'<br>')+'</div>':'')+'</div>';
    case "tool_call": return '<details><summary>→ <code>'+esc(e.name)+'</code><span class="n">'+t+'</span></summary><pre>'+esc(JSON.stringify(e.input,null,2))+'</pre></details>';
    case "tool_result": return '<details><summary>← <code>'+esc(e.name)+'</code><span class="n">'+e.ms+' ms</span></summary><pre>'+esc(typeof e.output==="string"?e.output:JSON.stringify(e.output,null,2))+'</pre></details>';
    case "rejection": return '<div><b class="bad">Verifier rejected</b> (round '+e.round+'): '+esc(e.reason)+'</div>';
    case "retry": return '<div><b>Executor retry</b> round '+e.round+'</div>';
    case "error": return '<div><b class="bad">API error:</b> '+esc(e.message)+'</div>';
    case "escalation": return '<div><b class="bad">Escalated to a human:</b> '+esc(e.reason)+'</div>';
    case "final": return '<details><summary><b class="ok">Final output</b><span class="n">'+t+'</span></summary><pre>'+esc(JSON.stringify(e.output,null,2))+'</pre></details>';
    default: return esc(JSON.stringify(e));
  } }
nav();
</script></body></html>
